name: password_generator
description: "A modern password generator app with customizable options, beautiful UI, and secure password creation features."

publish_to: "none"

version: 1.9.0+10

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  animate_do: ^5.1.0
  awesome_extensions: ^2.1.0
  cloud_firestore: ^5.6.7
  equatable: ^2.0.8
  firebase_auth: ^5.5.1
  firebase_core: ^3.15.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_hooks: ^0.21.3+1
  flutter_iconly: ^1.0.2
  flutter_svg: ^2.2.4
  google_fonts: ^8.1.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  hive_ce_generator: ^1.11.1
  iconsax_flutter: ^1.0.1
  intl: ^0.20.2
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  sleek_circular_slider: ^2.1.0
  sodium: ^4.0.2
  sodium_libs: ^4.0.0
  toastification: ^3.2.0
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.15.0
  # change_app_package_name: ^1.5.0
  flutter_lints: ^6.0.0
